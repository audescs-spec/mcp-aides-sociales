services:
  - type: web
    name: mcp-aides-sociales
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/server.py"
    healthCheckPath: "/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
